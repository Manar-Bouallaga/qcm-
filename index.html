<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM مباراة الشرطة: الدستور والقانون والاقتصاد</title>
<style>
:root{
  --bg:#f5f7f6;--card:#ffffff;--ink:#14231f;--muted:#5b6b66;--line:#dbe4e0;
  --accent:#0f766e;--accent-ink:#ffffff;--ok:#15803d;--ok-bg:#e7f6ec;--bad:#b91c1c;--bad-bg:#fdecec;
  --warn:#92400e;--warn-bg:#fff4e0;--sel:#e6f2ff;--sel-line:#2563eb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1715;--card:#17211e;--ink:#e8f0ed;--muted:#9fb1ab;--line:#28372f;
  --accent:#2dd4bf;--accent-ink:#06201c;--ok:#4ade80;--ok-bg:#12301f;--bad:#f87171;--bad-bg:#3a1717;
  --warn:#fbbf24;--warn-bg:#3a2a0c;--sel:#14263f;--sel-line:#60a5fa;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;font-size:17px}
.app{max-width:860px;margin:0 auto;padding:16px 16px 48px}
.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:1.5rem}
.hero p{margin:0;opacity:.92;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip b{background:var(--line);border-radius:999px;padding:0 8px;margin-inline-start:4px;font-size:.8rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on b{background:rgba(255,255,255,.25)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--bg);color:var(--ink);padding:8px 14px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:.9rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.tag{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-inline-end:6px}
.tag.vol{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.q{font-size:1.15rem;font-weight:700;margin:10px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer}
.opt .lt{flex:0 0 28px;height:28px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.opt.sel{background:var(--sel);border-color:var(--sel-line)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.6}
.fb{border-radius:12px;padding:12px 14px;margin-top:6px}
.fb p{margin:6px 0 0;font-size:.95rem}
.fb.g{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.b{background:var(--bad-bg);border:1px solid var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.grid button{font:inherit;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:.85rem}
.grid button.a{background:var(--sel);border-color:var(--sel-line)}
.grid button.c{outline:2px solid var(--accent)}
.score{font-size:2.6rem;font-weight:800;margin:0}
.catrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.92rem}
.catrow .nm{flex:0 0 46%}
.catrow .tr{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.catrow .tr i{display:block;height:100%;background:var(--accent)}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv:first-child{border-top:0}
.rv .a{color:var(--ok);font-weight:700}
.rv .w{color:var(--bad)}
input[type=search]{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:10px}
.note{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:.9rem}
footer{margin-top:20px;color:var(--muted);font-size:.85rem}
@media (max-width:520px){body{font-size:16px}.catrow .nm{flex-basis:55%}}
</style>
</head>

<script id="data">
const CATS={

  pen:"القانون الجنائي والمسطرة",
  nat:"الجنسية وقانون الأجانب",
  assoc:"الجمعيات والحريات العامة",
  intl:"المنظمات الدولية ومقراتها",

};
/* كل سؤال: [المحور, السؤال, الجواب الصحيح, [أجوبة خاطئة], الشرح, 1 إذا كانت المعلومة قابلة للتغير] */
const Q=[
/* ============ الدستور والمؤسسات الدستورية ============ */
["dustur","تم إقرار دستور المملكة الحالي عن طريق الاستفتاء الشعبي بتاريخ:","فاتح يوليوز 2011",["7 دجنبر 1962","13 شتنبر 1996","9 مارس 2011","29 يوليوز 2011"],"أُجري الاستفتاء يوم الجمعة فاتح يوليوز 2011. أما 9 مارس 2011 فهو تاريخ الخطاب الملكي الذي أعلن الإصلاح الدستوري، و29 يوليوز 2011 هو تاريخ الظهير الشريف رقم 1.11.91 بتنفيذ نص الدستور."],
["dustur","حسب الفصل الأول من الدستور، نظام الحكم بالمغرب هو:","ملكية دستورية، ديمقراطية، برلمانية واجتماعية",["ملكية دستورية، تشاركية وديمقراطية","ملكية برلمانية، ديمقراطية واستشارية","ملكية اجتماعية، برلمانية، تعددية وديمقراطية","ملكية دستورية، اجتماعية، برلمانية واستشارية"],"الفصل 1: نظام الحكم بالمغرب نظام ملكية دستورية، ديمقراطية برلمانية واجتماعية. ويقوم النظام الدستوري على فصل السلط وتوازنها وتعاونها، والديمقراطية المواطنة والتشاركية، ومبادئ الحكامة الجيدة وربط المسؤولية بالمحاسبة."],
["dustur","حسب الفصل 42 من الدستور، الملك هو:","رئيس الدولة وممثلها الأسمى ورمز وحدة الأمة وضامن دوام الدولة واستمرارها",["رئيس السلطة التنفيذية والمسؤول الأول عن الحكومة","رئيس الدولة ورئيس الحكومة في آن واحد","ممثل الأمة أمام البرلمان فقط","الحكم بين الأحزاب السياسية دون غيرها"],"الفصل 42: الملك رئيس الدولة وممثلها الأسمى، ورمز وحدة الأمة، وضامن دوام الدولة واستمرارها، والحكم الأسمى بين مؤسساتها، يسهر على احترام الدستور وحسن سير المؤسسات الدستورية."],
["dustur","يرأس الملك، بصفته أميرا للمؤمنين (الفصل 41)، المجلس:","العلمي الأعلى",["الأعلى للحسابات","الاقتصادي والاجتماعي والبيئي","الاستشاري للأسرة والطفولة","الأعلى للتربية والتكوين"],"المجلس العلمي الأعلى هو الجهة الوحيدة المؤهلة لإصدار الفتاوى التي تعتمد رسميا."],
["dustur","من يرأس المجلس الأعلى للسلطة القضائية؟","الملك",["رئيس الحكومة","وزير العدل","الرئيس الأول لمحكمة النقض","رئيس المحكمة الدستورية"],"يرأسه الملك، ويتولى الرئيس الأول لمحكمة النقض الرئاسة المنتدبة بمقتضى القانون التنظيمي 100.13. ولم يعد وزير العدل ضمن أعضائه منذ دستور 2011."],
["dustur","الرئيس المنتدب للمجلس الأعلى للسلطة القضائية هو بحكم القانون:","الرئيس الأول لمحكمة النقض",["الوكيل العام للملك لدى محكمة النقض","وزير العدل","رئيس المحكمة الدستورية","الرئيس الأول للمجلس الأعلى للحسابات"],"القانون التنظيمي 100.13 المتعلق بالمجلس الأعلى للسلطة القضائية."],
["dustur","من بين أعضاء المجلس الأعلى للسلطة القضائية بحكم القانون:","الوسيط ورئيس المجلس الوطني لحقوق الإنسان",["وزير العدل ووزير الداخلية","رئيس الحكومة","الأمين العام للحكومة","رئيس المجلس الدستوري"],"يضم المجلس بحكم القانون: الرئيس الأول لمحكمة النقض (رئيسا منتدبا)، والوكيل العام للملك لدى محكمة النقض، ورئيس الغرفة الأولى بمحكمة النقض، والوسيط، ورئيس المجلس الوطني لحقوق الإنسان، إضافة إلى قضاة منتخبين وخمس شخصيات يعينها الملك."],
["dustur","الضامن لاستقلال السلطة القضائية (الفصل 107) هو:","الملك",["رئيس الحكومة","وزير العدل","البرلمان","المحكمة الدستورية"],"الفصل 107: السلطة القضائية مستقلة عن السلطتين التشريعية والتنفيذية، والملك هو الضامن لاستقلالها."],
["dustur","حسب الفصل 47، يعين الملك رئيس الحكومة من:","الحزب السياسي الذي تصدر انتخابات مجلس النواب وعلى أساس نتائجها",["أي حزب يختاره بحرية دون ارتباط بنتائج الانتخابات","الحزب الحاصل على أغلبية مقاعد مجلس المستشارين","بين أعضاء مجلس المستشارين","بين الشخصيات التي يقترحها رئيس مجلس النواب"],"تطبيقا لهذا الفصل عيّن الملك محمد السادس فاطمة الزهراء المنصوري رئيسة للحكومة يوم 29 شتنبر 2026 بعد تصدر حزب الأصالة والمعاصرة انتخابات 23 شتنبر 2026."],
["dustur","يعين الملك أعضاء الحكومة:","باقتراح من رئيس الحكومة",["باقتراح من رئيس مجلس النواب","باقتراح من المجلس الأعلى للسلطة القضائية","بانتخاب من مجلس النواب","بتصويت المحكمة الدستورية"],"الفصل 47: يعين الملك أعضاء الحكومة باقتراح من رئيس الحكومة، وله أن يعفي عضوا أو أكثر بمبادرة منه بعد استشارة رئيس الحكومة، أو بطلب من هذا الأخير."],
["dustur","تعتبر الحكومة منصبة بعد حصولها على ثقة مجلس النواب، المعبر عنها بـ:","تصويت الأغلبية المطلقة للأعضاء الذين يتألف منهم المجلس لصالح البرنامج الحكومي",["تصويت أغلبية الأعضاء الحاضرين فقط","تصويت ثلثي أعضاء مجلس المستشارين","مصادقة المحكمة الدستورية على البرنامج","تعيين الملك لأعضائها دون حاجة لتصويت"],"الفصل 88 من الدستور."],
["dustur","يتطلب ملتمس الرقابة (الفصل 105) توقيع عدد من أعضاء مجلس النواب لا يقل عن:","الخمس (1/5)",["الربع","الثلث","النصف","العشر"],"الفصل 105: لمجلس النواب أن يعارض في مواصلة الحكومة تحمل مسؤوليتها بالموافقة على ملتمس رقابة يوقعه على الأقل خمس الأعضاء الذين يتألف منهم المجلس."],
["dustur","لا تسقط الحكومة بملتمس الرقابة إلا بتصويت:","الأغلبية المطلقة للأعضاء الذين يتألف منهم مجلس النواب",["أغلبية الأعضاء الحاضرين","ثلثي أعضاء المجلس","الثلث من أعضاء المجلس","أغلبية أعضاء مجلسي البرلمان معا"],"الفصل 105: لا يقع التصويت إلا بعد مرور ثلاثة أيام كاملة على إيداع الملتمس. وإذا وقعت الموافقة عليه فلا يقبل أي ملتمس رقابة جديد طيلة سنة."],
["dustur","تؤدي الموافقة على ملتمس الرقابة إلى:","استقالة الحكومة استقالة جماعية",["حل مجلس النواب تلقائيا","إعفاء رئيس الحكومة وحده","إجراء استفتاء شعبي","إعلان حالة الاستثناء"],"الفصل 105: تؤدي الموافقة على ملتمس الرقابة إلى استقالة الحكومة استقالة جماعية."],
["dustur","عدد أعضاء مجلس النواب هو:","395",["325","305","400","360"],"395 عضوا. في انتخابات 23 شتنبر 2026 تنافس 27 حزبا على 395 مقعدا، وكانت الأغلبية المطلقة 198 مقعدا."],
["dustur","مدة الولاية التشريعية لمجلس النواب هي:","5 سنوات",["4 سنوات","6 سنوات","7 سنوات","3 سنوات"],"مجلس النواب 5 سنوات، أما أعضاء مجلس المستشارين فيُنتخبون لمدة 6 سنوات."],
["dustur","يتألف مجلس المستشارين من:","120 عضوا",["90 عضوا","395 عضوا","180 عضوا","60 عضوا"],"الفصل 63: لا يقل عدد أعضاء مجلس المستشارين عن 90 ولا يزيد على 120، وقد حدده القانون التنظيمي في 120."],
["dustur","يفتتح الملك الدورة البرلمانية الأولى يوم:","الجمعة الثانية من شهر أكتوبر",["الجمعة الأولى من شهر أكتوبر","الجمعة الثالثة من شهر أكتوبر","الجمعة الثانية من شهر دجنبر","الجمعة الأولى من شهر أبريل"],"الفصل 65: يعقد البرلمان جلساته خلال دورتين في السنة. تبتدئ الدورة الأولى يوم الجمعة الثانية من أكتوبر، والدورة الثانية يوم الجمعة الثانية من أبريل."],
["dustur","تبتدئ الدورة الثانية من السنة التشريعية يوم:","الجمعة الثانية من شهر أبريل",["الجمعة الأولى من شهر أبريل","الجمعة الثانية من شهر مارس","الجمعة الثالثة من شهر أبريل","فاتح أبريل"],"الفصل 65 من الدستور."],
["dustur","يمارس رئيس الحكومة السلطة التنظيمية بواسطة:","مراسيم",["ظهائر","قوانين تنظيمية","أوامر ملكية","قرارات قضائية"],"الفصل 90: يمارس رئيس الحكومة السلطة التنظيمية، ويمكنه تفويض بعض سلطه إلى الوزراء."],
["dustur","يرأس المجلس الحكومي (مجلس الحكومة):","رئيس الحكومة",["الملك","وزير الداخلية","الأمين العام للحكومة","رئيس مجلس النواب"],"أما المجلس الوزاري فيرأسه الملك (الفصل 48)، ويمكنه أن يفوض رئاسته لرئيس الحكومة بناء على جدول أعمال محدد."],
["dustur","يجيب رئيس الحكومة أمام مجلسي البرلمان عن الأسئلة المتعلقة بالسياسة العامة:","مرة في الشهر",["مرة في الأسبوع","مرة في السنة","مرة كل ثلاثة أشهر","فقط عند طلب الملك"],"الفصل 100: تخصص جلسة في كل أسبوع لأسئلة أعضاء المجلسين وأجوبة الحكومة، وجلسة شهرية للأسئلة المتعلقة بالسياسة العامة يجيب عنها رئيس الحكومة."],
["dustur","يمارس حق العفو:","الملك",["رئيس الحكومة","وزير العدل","رئيس النيابة العامة","المجلس الأعلى للسلطة القضائية"],"الفصل 58 من الدستور."],
["dustur","يعلن حالة الاستثناء (الفصل 59):","الملك بظهير، بعد استشارة رئيس الحكومة ورئيسي مجلسي البرلمان ورئيس المحكمة الدستورية وتوجيه خطاب إلى الأمة",["رئيس الحكومة بمرسوم وحده","مجلس النواب بأغلبية الثلثين","وزير الداخلية بعد موافقة الولاة","المجلس الأعلى للأمن دون استشارة أحد"],"الفصل 59: لا يترتب عن حالة الاستثناء حل البرلمان، ولا يجوز المساس بالحقوق والحريات الأساسية."],
["dustur","القائد الأعلى ورئيس الأركان العامة للقوات المسلحة الملكية هو:","الملك",["رئيس الحكومة","الوزير المنتدب المكلف بإدارة الدفاع الوطني","رئيس مجلس النواب","الأمين العام للحكومة"],"الفصل 53 من الدستور."],
["dustur","المجلس الأعلى للأمن (الفصل 54) يرأسه الملك وهو:","هيئة للتشاور بشأن استراتيجيات الأمن الداخلي والخارجي وتدبير حالات الأزمات",["هيئة تنفيذية تدير الأجهزة الأمنية يوميا","هيئة قضائية تفصل في الجرائم الأمنية","هيئة تشريعية تسن قوانين الأمن","هيئة تشرف على الانتخابات"],"يسهر أيضا على مأسسة ضوابط الحكامة الأمنية الجيدة."],
["dustur","يضمن الدستور مبدأ المساواة بين الرجل والمرأة في الحقوق والحريات بمقتضى الفصل:","19",["16","17","18","20"],"الفصل 19. ويحدث هذا الفصل هيئة المناصفة ومكافحة كل أشكال التمييز."],
["dustur","الحق في الحياة، وهو أول الحقوق لكل إنسان، يضمنه الفصل:","20",["19","21","22","24"],"الفصل 20: الحق في الحياة. الفصل 21: الحق في سلامة الشخص وأقربائه وحماية ممتلكاته. الفصل 22: عدم المس بالسلامة الجسدية والمعنوية، وممارسة التعذيب جريمة."],

["dustur","تختص المحكمة الدستورية بالنظر في الدفع بعدم دستورية قانون يثار أثناء النظر في قضية بمقتضى الفصل:","133",["130","132","134","140"],"الفصل 133: يشترط أن يدفع أحد الأطراف بأن القانون الذي سيطبق في النزاع يمس بالحقوق والحريات التي يضمنها الدستور. وهذا الاختصاص هو ما جعل المحكمة تشبه محكمة حقيقية أكثر من مجلس."],
["dustur","القوانين التنظيمية والأنظمة الداخلية لمجلسي البرلمان تحال، قبل الأمر بتنفيذها أو الشروع في تطبيقها، وجوبا إلى:","المحكمة الدستورية",["الأمانة العامة للحكومة","المجلس الأعلى للسلطة القضائية","المجلس الاقتصادي والاجتماعي والبيئي","محكمة النقض"],"الفصل 132: لتبت في مطابقتها للدستور."],
["dustur","تتألف المحكمة الدستورية من:","12 عضوا يعينون لمدة 9 سنوات غير قابلة للتجديد",["9 أعضاء يعينون لمدة 5 سنوات قابلة للتجديد","15 عضوا يعينون لمدة 6 سنوات قابلة للتجديد","12 عضوا يعينون لمدة 9 سنوات قابلة للتجديد مرة واحدة","10 أعضاء يعينون لمدة 4 سنوات"],"الفصل 130 والقانون التنظيمي 066.13 المتعلق بالمحكمة الدستورية."],
["dustur","كيف يتوزع أعضاء المحكمة الدستورية الاثنا عشر؟","6 يعينهم الملك (بينهم عضو يقترحه الأمين العام للمجلس العلمي الأعلى) و3 ينتخبهم مجلس النواب و3 ينتخبهم مجلس المستشارين",["4 يعينهم الملك و4 ينتخبهم مجلس النواب و4 ينتخبهم مجلس المستشارين","6 يعينهم رئيس الحكومة و6 ينتخبهم البرلمان","كلهم يعينهم الملك","8 ينتخبهم البرلمان و4 يعينهم المجلس الأعلى للسلطة القضائية"],"ينتخب المجلسان أعضاءهما بالاقتراع السري وبأغلبية ثلثي الأعضاء الذين يتألف منهم كل مجلس."],
["dustur","يعين رئيس المحكمة الدستورية بظهير من طرف:","الملك، من بين أعضاء المحكمة",["رئيس الحكومة","رئيس مجلس النواب","المجلس الأعلى للسلطة القضائية","أعضاء المحكمة بالانتخاب فيما بينهم"],"القانون التنظيمي 066.13: يعين الملك رئيس المحكمة الدستورية بظهير من بين الأعضاء الذين تتألف منهم."],
["dustur","يتم تجديد ثلث أعضاء كل فئة من أعضاء المحكمة الدستورية كل:","3 سنوات",["سنة واحدة","5 سنوات","6 سنوات","9 سنوات"],"الفصل 130: تجديد ثلث كل فئة كل ثلاث سنوات. وبمناسبة التجديد استقبل الملك الأعضاء المعينين يوم 4 يونيو 2026."],
["dustur","المحكمة الدستورية خلفت:","المجلس الدستوري",["الغرفة الدستورية بالمجلس الأعلى","ديوان المظالم","المجلس الأعلى للقضاء","المجلس الاستشاري لحقوق الإنسان"],"أنشأ دستور 1992 المجلس الدستوري خلفا للغرفة الدستورية بالمجلس الأعلى (1962 إلى 1992)، وأحدث دستور 2011 المحكمة الدستورية التي عُيّن أعضاؤها سنة 2017."],

["dustur","المجلس الأعلى للحسابات هو، حسب الدستور:","الهيئة العليا لمراقبة المالية العمومية بالمملكة",["الهيئة العليا لمراقبة الانتخابات","الهيئة العليا لحماية المعطيات الشخصية","الهيئة العليا للاتصال السمعي البصري","هيئة التحكيم في النزاعات الضريبية"],"الفصل 147: ويضمن الدستور استقلاله. ويقدم الرئيس الأول للمجلس عرضا عن أعمال المجلس أمام البرلمان."],
["dustur","تندرج الهيئة العليا للاتصال السمعي البصري (الهاكا)، حسب الدستور، ضمن:","هيئات الحكامة الجيدة والتقنين",["هيئات حماية الحقوق والحريات","هيئات التنمية البشرية والمستدامة","السلطة القضائية","المؤسسات الاستشارية للملك"],"الباب 12 من الدستور: (أ) حماية الحقوق والحريات: المجلس الوطني لحقوق الإنسان، الوسيط، مجلس الجالية، هيئة المناصفة. (ب) الحكامة الجيدة والتقنين: الهاكا، مجلس المنافسة، الهيئة الوطنية للنزاهة. (ج) التنمية البشرية والمستدامة والديمقراطية التشاركية: المجلس الأعلى للتربية والتكوين، المجلس الاستشاري للأسرة والطفولة، المجلس الاستشاري للشباب والعمل الجمعوي."],

["inst","من هي رئيسة الحكومة المغربية الحالية؟","فاطمة الزهراء المنصوري",["نزهة الوافي","نادية فتاح","بسيمة الحقاوي","أمينة بوعياش"],"عيّنها الملك رئيسة للحكومة يوم 29 شتنبر 2026 بعد تصدر حزب الأصالة والمعاصرة انتخابات 23 شتنبر 2026 (97 مقعدا من 395)، وهي أول امرأة ترأس الحكومة في تاريخ المغرب. وعيّن الملك أعضاء حكومتها يوم 16 أكتوبر 2026.",1],

["inst","من هو رئيس المحكمة الدستورية؟","محمد أمين بنعبد الله",["سعيد إهراي","محمد عبد النباوي","هشام بلاوي","عمر السغروشني"],"عيّنه الملك رئيسا للمحكمة الدستورية خلفا لسعيد إهراي، وجدد تعيينه يوم 4 يونيو 2026 بمناسبة تجديد ثلث أعضاء المحكمة.",1],
["inst","من هو الرئيس الأول لمحكمة النقض والرئيس المنتدب للمجلس الأعلى للسلطة القضائية؟","محمد عبد النباوي",["هشام بلاوي","الحسن الداكي","سعيد إهراي","زينب العدوي"],"جدد الملك تعيينه رئيسا أول لمحكمة النقض ابتداء من 22 مارس 2026 (ظهير 1.26.16).",1],

["pen","قرينة البراءة معناها أن:","الأصل في المتهم البراءة إلى أن تثبت إدانته بحكم نهائي",["الأصل في المتهم الإدانة حتى تثبت براءته","للنيابة العامة أن تعتبر كل مشتبه فيه مذنبا","البراءة تثبت بعد إجراء الحراسة النظرية فقط","لا تطبق إلا على الجنح البسيطة"],"قرينة البراءة والحق في محاكمة عادلة مضمونان بالفصل 23 من الدستور."],
["pen","الجنحة في القانون الجنائي المغربي يعاقب عليها بصفة عامة بـ:","الحبس من شهر إلى 5 سنوات",["السجن من 5 إلى 30 سنة","الغرامة فقط دائما","الإعدام","الحبس أقل من 24 ساعة"],"أما الجناية فعقوبتها السجن المؤقت من 5 إلى 30 سنة أو السجن المؤبد أو الإعدام."],

["nat","صدر قانون الجنسية المغربية بظهير شريف رقم 1.58.250 بتاريخ:","6 شتنبر 1958",["15 نونبر 1958","7 دجنبر 1962","23 مارس 2007","10 فبراير 2023"],"عدل بعد ذلك مرات، أهمها القانون 62.06 (2007) والقانون 08.23 (2023)."],
["nat","التعديل الذي مكن الأم المغربية من نقل جنسيتها إلى أبنائها هو:","القانون رقم 62.06 (2007)",["القانون رقم 08.23","القانون رقم 03.23","القانون رقم 09.08","القانون رقم 76.15"],"بعد تعديل 2007 يعتبر مغربيا الولد المولود من أب مغربي أو من أم مغربية."],
["nat","حسب الفصل 5 من قانون الجنسية، عبارة «في المغرب» تشمل:","التراب المغربي والمياه الإقليمية والسفن والطائرات ذات الجنسية المغربية",["التراب المغربي فقط","التراب والمياه الإقليمية فقط","حدود المملكة البرية فقط","السفارات المغربية بالخارج فقط"],"الفصل 5 من قانون الجنسية. وحسب الفصل 4: سن الرشد في هذا القانون 18 سنة شمسية كاملة."],
["nat","الولد المولود في المغرب من أبوين مجهولين:","يعتبر مغربيا",["يعتبر عديم الجنسية","يخضع لجنسية البلد الذي وجد فيه أولا","لا يكتسب الجنسية إلا بعد الرشد","يحتاج إلى مرسوم للحصول على الجنسية"],"الفصل 7 من قانون الجنسية."],
["nat","حسب الفصل 9، يكتسب الجنسية المغربية الولد المولود في المغرب من أبوين أجنبيين مولودين هما أيضا فيه بشرط الإقامة الاعتيادية والمنتظمة وأن يصرح برغبته داخل:","السنتين السابقتين لبلوغه سن الرشد",["السنة الموالية لولادته","ثلاث سنوات بعد الرشد","خمس سنوات قبل الرشد","ستة أشهر بعد الرشد"],"ما لم يعارض في ذلك وزير العدل طبقا لقانون الجنسية. وهي الولادة المضاعفة."],
["nat","المدة الاعتيادية والمنتظمة للإقامة بالمغرب المشترطة في الزوجة الأجنبية المتزوجة من مغربي لاكتساب الجنسية (الفصل 10) هي:","5 سنوات",["سنة واحدة","سنتان","3 سنوات","10 سنوات"],"وهي نفس المدة المشترطة في التجنيس (الفصل 11): إقامة اعتيادية ومنتظمة 5 سنوات على الأقل. وتصريحها يكون ما لم يعارض وزير العدل."],
["nat","الأشخاص الذين ليست لهم جنسية معروفة يعتبرون:","عديمي الجنسية",["لاجئين","نازحين","مهاجرين","مجنسين"],"عديم الجنسية هو من لا تعتبره أي دولة مواطنا لها بمقتضى قانونها."],
["nat","من شروط التجنيس في قانون الجنسية المغربية:","الإقامة الاعتيادية والمنتظمة بالمغرب لمدة 5 سنوات على الأقل قبل تقديم الطلب",["الإقامة لمدة سنة واحدة","الزواج بمغربية","الحصول على شهادة جامعية","أن يكون من مواليد المغرب"],"كما تشترط شروط أخرى كبلوغ سن الرشد وحسن السيرة والمعرفة الكافية بالعربية. وقد أضاف القانون 08.23 (2023) معرفة الأمازيغية إلى شرط المعرفة اللغوية."],
["nat","الجهة المخول لها حق المعارضة في اكتساب الجنسية بمقتضى الفصلين 9 و10 هي:","وزير العدل",["وزير الداخلية","رئيس الحكومة","رئيس النيابة العامة","الوالي"],"تقدم المعارضة داخل الآجال المنصوص عليها في قانون الجنسية."],
["nat","تطبق مدونة الأسرة (من حيث ارتباطها بالجنسية) على:","جميع المغاربة ولو كانوا حاملين لجنسية أخرى",["المغاربة المقيمين بالمغرب فقط","المغاربة دون الأجانب فقط","المسلمين فقط خارج المغرب","المقيمين بالخارج دون المقيمين بالداخل"],"الفصل 3 من قانون الجنسية والمادة 2 من مدونة الأسرة."],
["nat","القانون المنظم لدخول الأجانب وإقامتهم بالمغرب والهجرة غير الشرعية هو:","القانون رقم 02.03 (2003)",["القانون رقم 03.03","القانون رقم 62.06","القانون رقم 08.23","القانون رقم 05.20"],"ظهير 11 نونبر 2003 بتنفيذ القانون 02.03."],

["assoc","نظام تأسيس الجمعيات بالمغرب هو:","نظام التصريح",["نظام الترخيص المسبق","نظام الاعتماد من وزارة الداخلية بقرار","نظام المباراة","نظام الانتخاب"],"تؤسس الجمعيات بكل حرية بمجرد التصريح لدى السلطة الإدارية المحلية، ولا تحتاج إلى ترخيص مسبق."],
["assoc","يسلم الوصل النهائي للجمعية وجوبا داخل أجل أقصاه:","60 يوما",["24 ساعة","10 أيام","30 يوما","6 أشهر"],"الفصل 5: عند استيفاء التصريح للإجراءات يسلم الوصل النهائي وجوبا داخل 60 يوما. وفي حالة عدم تسليمه داخل هذا الأجل جاز للجمعية أن تمارس نشاطها وفق الأهداف المسطرة في قوانينها. ويسلم وصل مؤقت فورا عند إيداع التصريح."],
["assoc","تعتبر الجمعية باطلة (الفصل 3) إذا كان هدفها:","غير مشروع أو مخالف للقوانين أو الآداب العامة أو يمس بالدين الإسلامي أو وحدة التراب أو النظام الملكي أو يدعو إلى التمييز",["تقديم خدمات اجتماعية للأحياء الفقيرة","تنظيم أنشطة رياضية","الدفاع عن البيئة","تنمية السياحة المحلية"],"وكل جمعية تؤسس لغاية غير مشروعة تكون باطلة."],
["assoc","لا يجوز حل الجمعيات أو توقيفها من طرف السلطات العمومية إلا بـ:","مقرر قضائي (الفصل 12 من الدستور)",["قرار من وزير الداخلية","قرار من الوالي أو العامل","مرسوم يصدره رئيس الحكومة","قرار من رئيس مجلس النواب"],"الفصل 12: تؤسس جمعيات المجتمع المدني والمنظمات غير الحكومية وتمارس أنشطتها بحرية في نطاق احترام الدستور والقانون."],
["assoc","يتم الاعتراف بصفة المنفعة العامة للجمعية بواسطة:","مرسوم",["ظهير شريف","قرار قضائي","قرار وزاري","مجرد التصريح"],"الفصل 9 من ظهير الجمعيات. والجمعيات المعترف لها بالمنفعة العامة هي وحدها التي يمكنها تلقي الهبات والوصايا وفق الشروط القانونية."],

["assoc","القانون التنظيمي المتعلق بالأحزاب السياسية هو:","29.11",["09.08","76.15","46.19","20.13"],"يؤطره الفصل 7 من الدستور (الأحزاب تساهم في التعبير عن إرادة الناخبين وفي ممارسة السلطة على أساس التعددية)."],
["assoc","الظهير الشريف المتعلق بالصحافة والنشر (الأصلي) الصادر في 15 نونبر 1958 رقمه:","1.58.378",["1.58.376","1.58.377","1.58.379","1.02.206"],"عدلته القوانين اللاحقة، ومنها القانون 77.00 (2002) قبل صدور قانون الصحافة والنشر الحالي."],

["gen","أصغر الكواكب في المجموعة الشمسية هو:","عطارد",["الزهرة","الأرض","المريخ","المشتري"],"وهو أقرب كواكب المجموعة الشمسية إلى الشمس."],
["gen","يقع البحر الميت بقارة:","آسيا",["أوروبا","إفريقيا","أمريكا","أستراليا"],"يقع بين الأردن وفلسطين."],
["gen","تقع جبال الأنديز في:","أمريكا الجنوبية",["أمريكا الشمالية","وسط القارة الأسترالية","غرب القارة الإفريقية","وسط القارة الآسيوية"],"أطول سلسلة جبلية قارية في العالم."],
["gen","تربط قناة بنما بين:","المحيط الأطلسي والمحيط الهادي",["البحر الأسود والمحيط الأطلسي","المحيط الهادي والمحيط الهندي","المحيط الهندي والمحيط الأطلسي","بحر الأدرياتيكي والبحر المتوسط"],"أنشئت لاختصار الطريق بين المحيطين."],
["gen","من الإمارات السبع المكونة لدولة الإمارات العربية المتحدة:","الشارقة",["جبل علي","الخور","الجزيرة","الريان"],"الإمارات السبع: أبوظبي، دبي، الشارقة، عجمان، أم القيوين، رأس الخيمة، الفجيرة."],
["gen","المدينة التي أطلق عليها لقب «زهرة المدائن» هي:","القدس",["دمشق","القاهرة","بيروت","صنعاء"],"لقب اشتهر به القدس."],
["gen","أكبر بحر داخلي في العالم هو:","بحر قزوين",["بحر البلطيق","البحر المتوسط","البحر الهندي","البحر الكاريبي"],"بحر قزوين في آسيا وأوروبا."],
["gen","أصغر جهة بالمغرب من حيث المساحة هي جهة:","طنجة تطوان الحسيمة",["الدار البيضاء سطات","مراكش آسفي","سوس ماسة","الشرق"],"تضم المملكة 12 جهة."],
["gen","أكبر بلد منتج للذهب في العالم هو:","الصين",["أمريكا","إسبانيا","السعودية","الإمارات العربية المتحدة"],"تتصدر الصين إنتاج الذهب عالميا في السنوات الأخيرة."],
["gen","العملة الرسمية للمملكة المتحدة هي:","الجنيه الإسترليني",["اليورو","الدولار","الفرنك","الكرونة"],"المملكة المتحدة لا تعتمد اليورو."],
["gen","أول دولة عملت بالنظام البرلماني هي:","بريطانيا",["فرنسا","إيطاليا","اليونان","الولايات المتحدة الأمريكية"],"ظهر النظام البرلماني في بريطانيا وتطور عبر قرون."],
["gen","يتواجد مقر الاتحاد الدولي لكرة القدم (FIFA) بمدينة:","زيوريخ",["باريس","برلين","فيينا","لندن"],"سويسرا."],
["gen","تتراوح أبعاد ملعب كرة القدم المخصص للمباريات الدولية بين:","100 و110 م طولا و64 و75 م عرضا",["120 و130 م طولا و80 و90 م عرضا","140 و150 م طولا و90 و95 م عرضا","160 و165 م طولا و90 و95 م عرضا","170 و175 م طولا و90 و95 م عرضا"],"حسب قوانين اللعبة."],
["gen","اشتهرت مدينة جرادة بمناجم:","الفحم الحجري",["الفوسفاط","الرصاص","الملح","الفضة"],"أما الفوسفاط فتشتهر به خريبكة."],
["gen","مخطط «أليوتيس» يهم قطاع:","الصيد البحري",["الفلاحة","السياحة","الطاقة","الغابات"],"أما مخطط المغرب الأخضر فيهم الفلاحة، ومخطط آزور السياحة."],
["gen","مخطط المغرب الأخضر يهم قطاع:","الفلاحة",["الصيد البحري","السياحة","الصناعة","الماء"],"أطلق سنة 2008."],
["gen","يخلد المغرب في 18 فبراير من كل سنة اليوم الوطني:","للسلامة الطرقية",["لحقوق الطفل","لحقوق المهاجر","للسلامة الجسدية","لسلامة المستهلك"],"وتشرف على السلامة الطرقية الوكالة الوطنية NARSA."],
["gen","يوجد مقر مؤسسة محمد السادس للعلماء الأفارقة بمدينة:","فاس",["الرباط","مراكش","مكناس","الدار البيضاء"],"أحدثت بظهير ملكي سنة 2015."],
["gen","يسمى مرض سرطان خلايا الدم بمرض:","اللوكيميا (ابيضاض الدم)",["الأنيميا","الأميبا","الأوديما","الفالوجيا"],"سرطان يصيب الدم ونخاع العظم."],
["gen","يعنى التعليم الأصيل بالمغرب بتدريس العلوم:","الشرعية",["الطبية","الفلسفية","الفيزيائية","الجغرافية"],"يشرف على هذا النوع من التعليم قطاع التربية الوطنية بتنسيق مع المؤسسات الدينية."],
["gen","يوجد رأس الرجاء الصالح في القارة:","الإفريقية",["الأوروبية","الآسيوية","الأسترالية","الأمريكية"],"جنوب إفريقيا."],
["gen","كان المغرب أول بلد يعترف باستقلال الولايات المتحدة الأمريكية، وذلك سنة:","1777",["1688","1812","1900","1956"],"في عهد السلطان سيدي محمد بن عبد الله."],
["gen","يرث الزوج عن زوجته إذا لم يكن لها فرع وارث:","النصف (1/2)",["الربع","الثلث","السدس","الثمن"],"وإذا كان لها فرع وارث فللزوج الربع (1/4). وترث الزوجة الربع عند عدم وجود فرع وارث للزوج، والثمن عند وجوده."],
["gen","ترث الزوجة عن زوجها إذا كان له فرع وارث:","الثمن (1/8)",["الربع","النصف","السدس","الثلث"],"وإذا لم يكن له فرع وارث فللزوجة الربع (1/4)."],
["gen","ترث الأم عن ابنها المتوفى الذي ترك ولدا (فرعا وارثا):","السدس (1/6)",["الثلث","النصف","الربع","الثمن"],"وتأخذ الثلث في غير هذه الحالة عند انعدام الفرع الوارث والإخوة المتعددين."]
];
</script>

<script>
(function(){
const LET=["أ","ب","ج","د","هـ"];
const app=document.getElementById("app");
const S={cats:new Set(Object.keys(CATS)),count:"20",mode:"practice"};
let R=null;

function get(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function clearTimer(){if(R&&R.timer){clearInterval(R.timer);R.timer=null;}}
function counts(){var c={};Q.forEach(function(x){c[x[0]]=(c[x[0]]||0)+1;});return c;}
function pad(n){return n<10?"0"+n:""+n;}

function home(){
  clearTimer();R=null;
  var c=counts();var wrong=get("qcm_wrong")||[];
  var chips=Object.keys(CATS).map(function(k){
    return '<button class="chip '+(S.cats.has(k)?"on":"")+'" data-act="cat" data-k="'+k+'">'+CATS[k]+' <b>'+c[k]+'</b></button>';
  }).join("");
  var counts_btn=["10","20","50","all"].map(function(v){
    return '<button class="'+(S.count===v?"on":"")+'" data-act="count" data-v="'+v+'">'+(v==="all"?"الكل":v)+'</button>';
  }).join("");
  app.innerHTML=
  '<div class="hero"><h1>QCM مباراة الشرطة</h1><p>'+Q.length+' سؤالا في الدستور والاقتصاد والقانون الجنائي والجنسية والجمعيات والمنظمات الدولية والمؤسسات الوطنية. آخر تحقق من المعلومات المتغيرة: 14 نونبر 2026.</p></div>'+
  '<div class="card"><h2>1) اختر المحاور</h2><div class="chips">'+chips+'</div>'+
  '<div class="row" style="margin-top:10px"><button class="btn sec" data-act="all">اختيار الكل</button><button class="btn sec" data-act="none">إلغاء الكل</button></div></div>'+
  '<div class="card"><h2>2) عدد الأسئلة</h2><div class="seg">'+counts_btn+'</div></div>'+
  '<div class="card"><h2>3) نمط الاشتغال</h2><div class="seg"><button class="'+(S.mode==="practice"?"on":"")+'" data-act="mode" data-v="practice">تمرين: تصحيح فوري مع الشرح</button><button class="'+(S.mode==="exam"?"on":"")+'" data-act="mode" data-v="exam">امتحان: مؤقت والتصحيح في الأخير</button></div>'+
  '<p class="muted" style="margin:8px 0 0">نمط الامتحان يخصص حوالي 72 ثانية لكل سؤال، مثل امتحان 50 سؤالا في ساعة.</p></div>'+
  '<div class="row"><button class="btn" data-act="start">ابدأ</button><button class="btn sec" data-act="study">ورقة المراجعة (كل المعلومات)</button>'+
  (wrong.length?'<button class="btn warn" data-act="retry-saved">أسئلة أخطأت فيها سابقا ('+wrong.length+')</button>':'')+'</div>'+
  '<div class="note" style="margin-top:16px">الأسئلة الموسومة بـ «معلومة قابلة للتغير» تخص أشخاصا يشغلون مناصب (رؤساء مؤسسات، وزراء). تحقق منها يوم الامتحان لأن التعيينات قد تتبدل.</div>'+
  '<footer>المراجع المعتمدة: نص الدستور (ظهير 1.11.91)، القانون التنظيمي 066.13، قانون الجنسية (ظهير 1.58.250)، ظهائر الحريات العامة لسنة 1958، قانون المسطرة الجنائية 22.01 كما عدله 03.23، موقع وكالة المغرب العربي للأنباء، والبوابات الرسمية للمؤسسات.</footer>';
}

function pool(ids){
  var arr=ids||Q.map(function(_,i){return i;}).filter(function(i){return S.cats.has(Q[i][0]);});
  arr=shuffle(arr);
  if(!ids&&S.count!=="all")arr=arr.slice(0,parseInt(S.count,10));
  return arr;
}
function start(ids,mode){
  if(!ids.length){alert("اختر محورا واحدا على الأقل");return;}
  R={mode:mode,i:0,items:ids.map(function(id){
    var q=Q[id];
    var opts=shuffle([{t:q[2],ok:true}].concat(q[3].map(function(t){return {t:t,ok:false};})));
    return {id:id,opts:opts,sel:null};
  })};
  if(mode==="exam"){R.end=Date.now()+ids.length*72000;R.timer=setInterval(tick,1000);}
  showQ();
}
function tick(){
  if(!R||R.mode!=="exam")return;
  var left=Math.max(0,Math.round((R.end-Date.now())/1000));
  var el=document.getElementById("timer");
  if(el)el.textContent=pad(Math.floor(left/60))+":"+pad(left%60);
  if(left<=0){finish();}
}
function showQ(){
  var it=R.items[R.i],q=Q[it.id],total=R.items.length;
  var answered=it.sel!==null,reveal=R.mode==="practice"&&answered;
  var opts=it.opts.map(function(o,k){
    var cls="opt";
    if(reveal){if(o.ok)cls+=" ok";else if(k===it.sel)cls+=" bad";else cls+=" dim";}
    else if(it.sel===k)cls+=" sel";
    return '<button class="'+cls+'" data-act="pick" data-k="'+k+'"'+(reveal?' disabled':'')+'><span class="lt">'+LET[k]+'</span><span>'+esc(o.t)+'</span></button>';
  }).join("");
  var fb="";
  if(reveal){
    var good=it.opts[it.sel].ok;
    fb='<div class="fb '+(good?"g":"b")+'"><b>'+(good?"إجابة صحيحة":"إجابة خاطئة")+'</b>'+(good?"":'<div>الصحيح: '+esc(q[2])+'</div>')+'<p>'+esc(q[4])+'</p></div>';
  }
  var nav="";
  if(R.mode==="practice"){
    nav='<div class="nav"><button class="btn sec" data-act="quit">إنهاء الآن</button>'+
      '<button class="btn" data-act="next"'+(answered?'':' disabled')+'>'+(R.i===total-1?"عرض النتيجة":"السؤال التالي")+'</button></div>';
  }else{
    var grid=R.items.map(function(x,n){return '<button class="'+(x.sel!==null?"a ":"")+(n===R.i?"c":"")+'" data-act="go" data-k="'+n+'">'+(n+1)+'</button>';}).join("");
    nav='<div class="nav"><button class="btn sec" data-act="prev"'+(R.i===0?' disabled':'')+'>السابق</button>'+
      (R.i===total-1?'<button class="btn" data-act="finish">إنهاء وتصحيح</button>':'<button class="btn" data-act="next">التالي</button>')+'</div><div class="grid">'+grid+'</div>';
  }
  var left=R.mode==="exam"?Math.max(0,Math.round((R.end-Date.now())/1000)):0;
  app.innerHTML=
  '<div class="topbar"><span class="muted">السؤال '+(R.i+1)+' من '+total+'</span>'+(R.mode==="exam"?'<b id="timer">'+pad(Math.floor(left/60))+':'+pad(left%60)+'</b>':'')+'</div>'+
  '<div class="bar"><i style="width:'+Math.round((R.i+(answered?1:0))/total*100)+'%"></i></div>'+
  '<div class="card"><span class="tag">'+CATS[q[0]]+'</span>'+(q[5]?'<span class="tag vol">معلومة قابلة للتغير</span>':'')+
  '<div class="q">'+esc(q[1])+'</div>'+opts+fb+nav+'</div>';
  window.scrollTo(0,0);
}
function pick(k){
  var it=R.items[R.i];
  if(R.mode==="practice"&&it.sel!==null)return;
  it.sel=k;showQ();
}
function finish(){
  if(!R)return;
  clearTimer();
  var wrong=get("qcm_wrong")||[];var ws=new Set(wrong);
  var ok=0,per={};
  R.items.forEach(function(it){
    var q=Q[it.id];per[q[0]]=per[q[0]]||{t:0,ok:0};per[q[0]].t++;
    var good=it.sel!==null&&it.opts[it.sel].ok;
    if(good){ok++;per[q[0]].ok++;ws.delete(it.id);}
    else if(it.sel!==null||R.mode==="exam"){ws.add(it.id);}
  });
  put("qcm_wrong",Array.from(ws));
  var total=R.items.length,pct=Math.round(ok/total*100);
  var rows=Object.keys(per).map(function(k){
    var p=per[k],pp=Math.round(p.ok/p.t*100);
    return '<div class="catrow"><span class="nm">'+CATS[k]+'</span><span class="tr"><i style="width:'+pp+'%"></i></span><span>'+p.ok+'/'+p.t+'</span></div>';
  }).join("");
  var bad=R.items.filter(function(it){return !(it.sel!==null&&it.opts[it.sel].ok);});
  var list=bad.map(function(it){
    var q=Q[it.id];
    return '<div class="rv"><div><b>'+esc(q[1])+'</b></div>'+
      (it.sel!==null?'<div class="w">إجابتك: '+esc(it.opts[it.sel].t)+'</div>':'<div class="w">بدون جواب</div>')+
      '<div class="a">الصحيح: '+esc(q[2])+'</div><div class="muted">'+esc(q[4])+'</div></div>';
  }).join("");
  var badIds=bad.map(function(it){return it.id;});
  R.badIds=badIds;
  app.innerHTML=
  '<div class="card"><h2>النتيجة</h2><p class="score">'+ok+' / '+total+' ('+pct+'%)</p>'+
  '<p class="muted">'+(pct>=80?"ممتاز. استمر على هذا المستوى.":pct>=60?"جيد، راجع الأخطاء أسفله وأعد المحاولة.":"تحتاج مراجعة إضافية للمحاور الضعيفة أسفله.")+'</p>'+rows+'</div>'+
  '<div class="row" style="margin-bottom:14px"><button class="btn" data-act="home">قائمة البداية</button>'+
  (badIds.length?'<button class="btn warn" data-act="retry-bad">أعد الأسئلة الخاطئة ('+badIds.length+')</button>':'')+'</div>'+
  (bad.length?'<div class="card"><h2>مراجعة الأخطاء</h2>'+list+'</div>':'<div class="card">لا أخطاء، عمل ممتاز.</div>');
  window.scrollTo(0,0);
}
function study(filter,text){
  var c=counts();
  var chips=['<button class="chip '+(!filter?"on":"")+'" data-act="sf" data-k="">الكل <b>'+Q.length+'</b></button>'].concat(Object.keys(CATS).map(function(k){
    return '<button class="chip '+(filter===k?"on":"")+'" data-act="sf" data-k="'+k+'">'+CATS[k]+' <b>'+c[k]+'</b></button>';
  })).join("");
  var items=Q.filter(function(q){
    if(filter&&q[0]!==filter)return false;
    if(text){var t=text.trim();if(t&&(q[1]+" "+q[2]+" "+q[4]).indexOf(t)===-1)return false;}
    return true;
  }).map(function(q){
    return '<div class="rv"><div><span class="tag">'+CATS[q[0]]+'</span>'+(q[5]?'<span class="tag vol">قابلة للتغير</span>':'')+'</div><div><b>'+esc(q[1])+'</b></div><div class="a">'+esc(q[2])+'</div><div class="muted">'+esc(q[4])+'</div></div>';
  }).join("")||'<p class="muted">لا نتائج.</p>';
  app.innerHTML='<div class="topbar"><h2 style="margin:0">ورقة المراجعة</h2><button class="btn sec" data-act="home">رجوع</button></div>'+
  '<input type="search" id="q" placeholder="ابحث عن كلمة أو رقم قانون…" value="'+esc(text||"")+'">'+
  '<div class="chips" style="margin-bottom:12px">'+chips+'</div><div class="card">'+items+'</div>';
  var inp=document.getElementById("q");
  inp.addEventListener("input",function(){study(filter,inp.value);var n=document.getElementById("q");n.focus();n.setSelectionRange(n.value.length,n.value.length);});
}

app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,k=b.dataset.k,v=b.dataset.v;
  if(a==="cat"){if(S.cats.has(k))S.cats.delete(k);else S.cats.add(k);home();}
  else if(a==="all"){S.cats=new Set(Object.keys(CATS));home();}
  else if(a==="none"){S.cats=new Set();home();}
  else if(a==="count"){S.count=v;home();}
  else if(a==="mode"){S.mode=v;home();}
  else if(a==="start"){start(pool(),S.mode);}
  else if(a==="study"){study("","");}
  else if(a==="sf"){study(k,"");}
  else if(a==="retry-saved"){var w=(get("qcm_wrong")||[]).filter(function(i){return Q[i];});start(shuffle(w),"practice");}
  else if(a==="retry-bad"){start(shuffle(R.badIds),"practice");}
  else if(a==="pick"){pick(parseInt(k,10));}
  else if(a==="next"){if(R.i<R.items.length-1){R.i++;showQ();}else{finish();}}
  else if(a==="prev"){if(R.i>0){R.i--;showQ();}}
  else if(a==="go"){R.i=parseInt(k,10);showQ();}
  else if(a==="finish"||a==="quit"){finish();}
  else if(a==="home"){home();}
});
home();
})();
</script>
</body>
</html>
